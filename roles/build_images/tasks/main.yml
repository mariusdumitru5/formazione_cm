- name: Push dell'immagine sul Registry
  community.docker.docker_image:
    name: "{{ item }}:{{ tag | default('latest') }}"
    repository: "{{ registry_ip }}/{{ item }}:{{ tag | default('latest') }}"
    push: true
    source: local
  loop: 
    - "{{ image_name_a }}"
    - "{{ image_name_b }}"